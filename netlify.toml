[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://sindh-smart-quiz.vercel.app/api/v1"

# React Router needs every non-file route to load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
